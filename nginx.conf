server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: 클라이언트 라우팅.
    #  1) 사전 렌더 파일($uri/index.html: /kr, /kr/test, /kr/privacy 등)이 있으면 그것을 서빙 — 색인 대상
    #  2) 없으면 app.html(noindex, canonical 없음) 로 폴백 — 앱은 정상 동작하되 색인은 되지 않는다.
    #     영문 루트 셸(index.html)로 폴백하면 /terms·/kr/race 같은 URL 이 전부 "영문 홈 + canonical=/"
    #     중복 문서로 색인된다(실제로 그렇게 색인됐다). 폴백 셸을 분리해 그것을 차단한다.
    location / {
        try_files $uri $uri/index.html /app.html;
    }

    # 해시 파일명 에셋은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
